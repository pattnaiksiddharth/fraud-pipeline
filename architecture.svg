<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#14213D"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F3F5F8"/>

  <text x="40" y="64" font-size="34" font-weight="700" fill="#14213D">Real-time card fraud detection pipeline</text>
  <text x="40" y="96" font-size="17" fill="#5B667A">Kafka, PySpark Structured Streaming, Delta Lake, PostgreSQL, an LLM for triage, Airflow, Grafana</text>

  <!-- Generator -->
  <rect x="40" y="300" width="170" height="170" rx="10" fill="#E3EEFB" stroke="#2F6FBF" stroke-width="2"/>
  <text x="125" y="340" font-size="22" font-weight="700" fill="#14213D" text-anchor="middle">Generator</text>
  <text x="125" y="368" font-size="14" fill="#5B667A" text-anchor="middle">Python, simulated cards</text>
  <text x="125" y="404" font-size="14" fill="#14213D" text-anchor="middle">bursts</text>
  <text x="125" y="426" font-size="14" fill="#14213D" text-anchor="middle">impossible travel</text>
  <text x="125" y="448" font-size="14" fill="#14213D" text-anchor="middle">large amounts</text>

  <!-- Kafka -->
  <rect x="250" y="300" width="170" height="170" rx="10" fill="#E8EDF5" stroke="#1D3557" stroke-width="2"/>
  <text x="335" y="340" font-size="22" font-weight="700" fill="#14213D" text-anchor="middle">Kafka</text>
  <text x="335" y="368" font-size="14" fill="#5B667A" text-anchor="middle">topic: transactions</text>
  <text x="335" y="404" font-size="14" fill="#14213D" text-anchor="middle">3 partitions</text>
  <text x="335" y="426" font-size="14" fill="#14213D" text-anchor="middle">keyed by card_id</text>
  <text x="335" y="448" font-size="14" fill="#14213D" text-anchor="middle">durable, replayable</text>

  <!-- Spark container -->
  <rect x="460" y="190" width="640" height="380" rx="14" fill="#FFFFFF" stroke="#7A8699" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="480" y="224" font-size="20" font-weight="700" fill="#14213D">PySpark Structured Streaming (one application)</text>
  <text x="480" y="266" font-size="15" fill="#5B667A">Delta Lake: ACID writes, checkpoints, medallion layers</text>

  <rect x="485" y="290" width="170" height="200" rx="10" fill="#F1E2D3" stroke="#B5733A" stroke-width="2"/>
  <text x="570" y="326" font-size="21" font-weight="700" fill="#14213D" text-anchor="middle">Bronze</text>
  <text x="570" y="360" font-size="14" fill="#14213D" text-anchor="middle">raw JSON as received</text>
  <text x="570" y="382" font-size="14" fill="#14213D" text-anchor="middle">plus Kafka offsets</text>
  <text x="570" y="420" font-size="14" fill="#5B667A" text-anchor="middle">audit trail,</text>
  <text x="570" y="442" font-size="14" fill="#5B667A" text-anchor="middle">can be replayed</text>

  <rect x="685" y="290" width="170" height="200" rx="10" fill="#E6E9EF" stroke="#8A94A6" stroke-width="2"/>
  <text x="770" y="326" font-size="21" font-weight="700" fill="#14213D" text-anchor="middle">Silver</text>
  <text x="770" y="360" font-size="14" fill="#14213D" text-anchor="middle">parsed, deduplicated</text>
  <text x="770" y="382" font-size="14" fill="#14213D" text-anchor="middle">10 s and 5 min windows</text>
  <text x="770" y="404" font-size="14" fill="#14213D" text-anchor="middle">distance, speed,</text>
  <text x="770" y="426" font-size="14" fill="#14213D" text-anchor="middle">spend vs average</text>
  <text x="770" y="460" font-size="14" fill="#5B667A" text-anchor="middle">bad rows: quarantine</text>

  <rect x="885" y="290" width="170" height="200" rx="10" fill="#F6EBC4" stroke="#C9A227" stroke-width="2"/>
  <text x="970" y="326" font-size="21" font-weight="700" fill="#14213D" text-anchor="middle">Gold</text>
  <text x="970" y="360" font-size="14" fill="#14213D" text-anchor="middle">rule scoring, 0 to 100</text>
  <text x="970" y="396" font-size="14" fill="#14213D" text-anchor="middle">BURST</text>
  <text x="970" y="418" font-size="14" fill="#14213D" text-anchor="middle">IMPOSSIBLE_TRAVEL</text>
  <text x="970" y="440" font-size="14" fill="#14213D" text-anchor="middle">LARGE_AMOUNT</text>
  <text x="970" y="472" font-size="14" fill="#5B667A" text-anchor="middle">is_flagged</text>

  <rect x="485" y="512" width="570" height="40" rx="8" fill="#DDF0F2" stroke="#2A7F8E" stroke-width="1.5"/>
  <text x="770" y="538" font-size="15" fill="#14213D" text-anchor="middle">Postgres sink: idempotent, replays create no duplicates</text>

  <!-- PostgreSQL -->
  <rect x="1140" y="300" width="170" height="170" rx="10" fill="#DDF0F2" stroke="#2A7F8E" stroke-width="2"/>
  <text x="1225" y="340" font-size="22" font-weight="700" fill="#14213D" text-anchor="middle">PostgreSQL</text>
  <text x="1225" y="368" font-size="14" fill="#5B667A" text-anchor="middle">serving layer</text>
  <text x="1225" y="404" font-size="14" fill="#14213D" text-anchor="middle">flagged_transactions</text>
  <text x="1225" y="426" font-size="14" fill="#14213D" text-anchor="middle">alerts, case status</text>
  <text x="1225" y="448" font-size="14" fill="#14213D" text-anchor="middle">stats per minute</text>

  <!-- Right column -->
  <rect x="1350" y="170" width="210" height="130" rx="10" fill="#ECE6F7" stroke="#6B4FBB" stroke-width="2"/>
  <text x="1455" y="206" font-size="20" font-weight="700" fill="#14213D" text-anchor="middle">Alert service</text>
  <text x="1455" y="232" font-size="14" fill="#14213D" text-anchor="middle">LLM (OpenAI or stub)</text>
  <text x="1455" y="258" font-size="14" fill="#5B667A" text-anchor="middle">severity, explanation,</text>
  <text x="1455" y="278" font-size="14" fill="#5B667A" text-anchor="middle">suggested action</text>

  <rect x="1350" y="330" width="210" height="100" rx="10" fill="#E1F1E7" stroke="#2E8B57" stroke-width="2"/>
  <text x="1455" y="368" font-size="20" font-weight="700" fill="#14213D" text-anchor="middle">Grafana</text>
  <text x="1455" y="398" font-size="14" fill="#5B667A" text-anchor="middle">live monitoring</text>

  <rect x="1350" y="460" width="210" height="100" rx="10" fill="#E1F1E7" stroke="#2E8B57" stroke-width="2"/>
  <text x="1455" y="498" font-size="20" font-weight="700" fill="#14213D" text-anchor="middle">Analyst console</text>
  <text x="1455" y="528" font-size="14" fill="#5B667A" text-anchor="middle">Streamlit, case decisions</text>

  <!-- Arrows -->
  <line x1="212" y1="385" x2="248" y2="385" stroke="#14213D" stroke-width="2" marker-end="url(#a)"/>
  <line x1="422" y1="385" x2="458" y2="385" stroke="#14213D" stroke-width="2" marker-end="url(#a)"/>
  <line x1="657" y1="390" x2="683" y2="390" stroke="#14213D" stroke-width="2" marker-end="url(#a)"/>
  <line x1="857" y1="390" x2="883" y2="390" stroke="#14213D" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1102" y1="385" x2="1138" y2="385" stroke="#14213D" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1312" y1="360" x2="1348" y2="250" stroke="#14213D" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="1312" y1="385" x2="1348" y2="385" stroke="#14213D" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1312" y1="410" x2="1348" y2="500" stroke="#14213D" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- Airflow band -->
  <rect x="460" y="650" width="850" height="100" rx="12" fill="#FFFFFF" stroke="#7A8699" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="485" y="686" font-size="20" font-weight="700" fill="#14213D">Airflow: scheduled batch work, outside the stream</text>
  <text x="485" y="716" font-size="15" fill="#5B667A">alert retries, daily summary and data quality checks, Delta compaction and vacuum</text>
  <line x1="770" y1="648" x2="770" y2="572" stroke="#7A8699" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <line x1="1225" y1="648" x2="1225" y2="472" stroke="#7A8699" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>

  <!-- Principle -->
  <rect x="40" y="650" width="380" height="100" rx="12" fill="#14213D"/>
  <text x="230" y="692" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">Rules detect.</text>
  <text x="230" y="720" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">The LLM explains. Analysts decide.</text>

  <text x="40" y="840" font-size="15" fill="#5B667A">Runs locally with Docker Compose. Fraud is simulated and labeled, so detection can be measured. The labels are never used by the rules.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
